<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepAI Gateway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-black-32.png" id="favicon">
<link rel="apple-touch-icon" href="/icon-black.png">
<script>
  /*
   * Pick the tab icon that is actually visible, before the first paint.
   *
   * The artwork is one glyph in two colours, so each disappears against the
   * opposite background. CSS can choose between two <img> elements but cannot
   * touch a favicon at all, so this one case is decided here rather than in
   * app.js — which also keeps the tab from showing the wrong mark while the
   * module loads.
   */
  (function () {
    var stored = null;
    try { stored = localStorage.getItem('deepai-gateway-theme'); } catch (e) {}
    var dark = stored === 'dark'
      || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    if (dark) document.getElementById('favicon').href = '/icon-32.png';
  })();
</script>
</head>
<body>

<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" href="#/">
      <span class="brand__mark" aria-hidden="true">
        <img class="brand__logo brand__logo--on-light" src="/icon-black.png" alt="" width="20" height="20">
        <img class="brand__logo brand__logo--on-dark" src="/icon.png" alt="" width="20" height="20">
      </span>
      <span class="brand__name">DeepAI Gateway</span>
    </a>
    <nav class="nav">
      <a class="nav__link" href="#/" data-route="home" data-i18n="nav.overview">Overview</a>
      <a class="nav__link" href="#/models" data-route="models" data-i18n="nav.models">Models</a>
      <a class="nav__link" href="#/keys" data-route="keys" data-i18n="nav.keys">API Keys</a>
    </nav>
    <div class="topbar__right">
      <span class="badge badge--gray" id="account-badge">
        <span class="dot"></span><span id="account-badge-text" data-i18n="common.checking">Checking…</span>
      </span>
      <button class="btn btn--sm btn--signout" id="auth-button" hidden data-i18n="common.logOut">Log out</button>
      <button class="btn btn--ghost btn--icon" id="theme-toggle" data-i18n-attr="title:common.toggleTheme,aria-label:common.toggleTheme" title="Toggle theme" aria-label="Toggle theme">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
          <path d="M8 1.5v1.6M8 12.9v1.6M14.5 8h-1.6M3.1 8H1.5M12.6 3.4l-1.1 1.1M4.5 11.5l-1.1 1.1M12.6 12.6l-1.1-1.1M4.5 4.5 3.4 3.4"/>
          <circle cx="8" cy="8" r="3.1"/>
        </svg>
      </button>
      <div class="lang">
        <button class="btn btn--ghost btn--sm lang__button" id="locale-button" aria-haspopup="listbox"
          aria-expanded="false" data-i18n-attr="title:common.language,aria-label:common.language"
          title="Language" aria-label="Language">
          <span class="lang__flag" id="locale-flag" aria-hidden="true">🇬🇧</span>
        </button>
        <div class="lang__menu" id="locale-menu" role="listbox" hidden></div>
      </div>
    </div>
  </div>
</header>

<main class="page" id="view" aria-live="polite"></main>

<div class="toasts" id="toasts"></div>

<div class="modal-backdrop" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal__head">
      <h2 class="modal__title" id="modal-title"></h2>
      <button class="btn btn--ghost btn--icon" id="modal-close" aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/>
        </svg>
      </button>
    </div>
    <div class="modal__body" id="modal-body"></div>
  </div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
